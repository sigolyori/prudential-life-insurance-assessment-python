[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prudential-life-insurance"
version = "0.1.0"
description = "LightGBM + SHAP + GenAI pipeline for Prudential life insurance underwriting assessment"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "lightgbm>=4.0.0",
    "shap>=0.41.0",
    "joblib>=1.2.0",
    "tqdm>=4.65.0",
    "Pillow>=9.0.0",
    "python-dotenv>=0.19.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.24.0",
    "plotly>=5.0.0",
    "pyarrow>=10.0.0",
]
gradio = [
    "gradio>=3.0.0",
]
training = [
    "optuna>=3.0.0",
    "scipy>=1.10.0",
    "missingno>=0.5.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sigolyori/prudential-life-insurance-assessment-python"
Documentation = "https://sigolyori.github.io/prudential-life-insurance-assessment-python"
